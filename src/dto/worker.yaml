components:
  schemas:
    WorkerLaunchTaskRequest:
      type: object
      additionalProperties: false
      properties:
        task_id:
          type: string
          format: uuid
        hash:
          type: string
        start:
          type: string
        count:
          type: integer
          format: int64
          minimum: 0
      required: [hash, start, count, task_id]
    WorkerTaskResult:
      type: object
      additionalProperties: false
      properties:
        result:
          type: string
        status:
          type: string
        task_id:
          type: string
          format: uuid
      required: [ status, task_id]
    WorkerKillTaskRequest:
      type: object
      additionalProperties: false
      properties:
        task_id:
          type: string
          format: uuid
      required: [task_id]
